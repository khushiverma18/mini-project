<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>randam quote</title>
    <link rel="stylesheet" href="quote.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body>
    <div class="wrap">
    <h1>Quote of the Day</h1>
    <hr>
    <br>
    <div class="content">
        <div class="area">
            <i class="fas fa-quote-left"></i>
          <p class="quote">Every day is a new day, and you’ll never be able to find happiness if you don’t move on..</p>
            <i class="fas fa-quote-right"></i>
        </div>
        <div class="author">
            <span>--</span>
            <span class="name">Mary kay Ash</span>
        </div>
        </div>
        <div class="button">
            <div class="feature">
                <ul>
                    <li class="sound"><i class="fa fa-volume-up" aria-hidden="true"></i></li>
                    <li class="copy"><i class="fas fa-copy"></i></li>
                    <li class="share"> <i class="far fa-share-square"></i></li>
                </ul>
                <button>New Quote</button>
            </div>
        </div>
    </div>
<script src="quote.js"></script>
</body>
</html>
